<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Fonts are bundled locally (see main.jsx), so nothing external is allowed.

       `connect-src` allows loopback WebSockets because that is how a remote
       desktop reaches its bridge: the main process listens on 127.0.0.1 on an
       ephemeral port, so the port cannot be named here and is wildcarded. It
       stays a loopback-only allowance, and the bridge itself only accepts a
       single connection bearing a 128-bit token it just issued.

       `wasm-unsafe-eval` is what lets an RDP pane exist: the session is driven
       by IronRDP compiled to WebAssembly, and Chromium will not compile a
       module at all under a `script-src` that does not say so. It permits
       WebAssembly compilation and nothing else; `unsafe-eval`, which would
       also open `eval` and `new Function` to JavaScript, is still refused. The
       module arrives as bytes over IPC rather than from a URL, so no source
       needs to be allowed here either. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' ws://localhost:5173 ws://127.0.0.1:*">
  <title>Reef Terminal</title>
  <link rel="stylesheet" href="./xterm.css">
  <link rel="stylesheet" href="./input.css">
  <style>
    /* Plain CSS, not Tailwind: this has to paint before anything JS-loaded
       (Tailwind's own output included) has had a chance to run. Removed by
       main.jsx once Root() knows what it's actually showing. */
    #boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #16161e;
      z-index: 9999;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }
    #boot-splash.boot-splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash svg {
      width: 56px;
      height: auto;
    }
    #boot-splash span {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body class="h-full">
  <div id="root" class="h-full"></div>
  <div id="boot-splash">
    <svg width="159" height="132" viewBox="0 0 159 132" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path opacity="0.8"
        d="M147.903 56.4801C141.988 49.2327 133.837 44.2036 124.756 42.1989C122.761 32.9202 119.089 24.852 113.901 18.236C113.761 18.0066 113.6 17.7907 113.422 17.5905C95.9418 -3.7907 67.2871 -3.71003 47.9709 7.34358C31.4483 16.8645 17.4005 36.9545 24.7436 65.7584C7.82222 69.9542 0 84.8806 0 98.3547C0 113.443 9.73786 130.467 31.5282 132H114.061C125.395 132 136.17 127.804 144.471 120.059C164.585 102.308 161.952 73.1814 147.903 56.4801Z"
        fill="url(#boot-splash-gradient)" />
      <defs>
        <linearGradient id="boot-splash-gradient" x1="79.5001" y1="0" x2="79.5001" y2="132"
          gradientUnits="userSpaceOnUse">
          <stop stop-color="#307AF0" />
          <stop offset="1" stop-color="#0FCBE3" />
        </linearGradient>
      </defs>
    </svg>
    <span>Reef Terminal</span>
  </div>
  <script type="module" src="./main.jsx"></script>
</body>

</html>
